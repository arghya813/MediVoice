<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediVoice — Your medicine, explained simply</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("medivoice.settings");
          var s = raw ? JSON.parse(raw) : {};
          var sizes = { normal: "16px", large: "18px", xlarge: "21px" };
          document.documentElement.style.fontSize = sizes[s.textSize] || "16px";
          if (s.theme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
